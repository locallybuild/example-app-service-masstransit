version: 2
updates:
  # Terraform providers
  - package-ecosystem: "terraform"
    directories:
      - "/environments/locally"
      - "/modules/app-service-masstransit"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns:
          - "*"

  # GitHub Actions used by the CI
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
